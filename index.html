<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  }

  body {
    background: #0b0f17;
    color: #e5e7eb;
    display: flex;
    height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    background: #0a0f1a;
    border-right: 1px solid #1f2937;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #111827;
    border: 2px solid #3b82f6;
    margin: auto;
  }

  .name {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
  }

  .role {
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
  }

  .info {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
  }

  .btn {
    padding: 10px;
    background: #2563eb;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }

  .btn:hover {
    background: #1d4ed8;
  }

  /* MAIN */
  .main {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
  }

  /* TOP NAV */
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    border-bottom: 1px solid #1f2937;
    padding-bottom: 10px;
  }

  .tab {
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    color: #94a3b8;
  }

  .tab.active {
    background: #1e293b;
    color: white;
  }

  /* CONTENT */
  .section {
    display: none;
    animation: fade 0.3s ease;
  }

  .section.active {
    display: block;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2 {
    margin-bottom: 15px;
    color: #38bdf8;
  }

  .card {
    background: #0f172a;
    border: 1px solid #1f2937;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
  }

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="avatar"></div>

  <div class="name">Your Name</div>
  <div class="role">Tier 3 Technical Support Engineer</div>

  <div class="info">
    📧 email@example.com<br>
    📞 +123 456 789<br>
    📍 Your City
  </div>

  <button class="btn">Download CV</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="show('about', this)">About</div>
    <div class="tab" onclick="show('resume', this)">Resume</div>
    <div class="tab" onclick="show('projects', this)">Projects</div>
    <div class="tab" onclick="show('skills', this)">Skills</div>
  </div>

  <!-- SECTIONS -->

  <div id="about" class="section active">
    <h2>About Me</h2>
    <div class="card">
      Write your professional summary here.
    </div>
  </div>

  <div id="resume" class="section">
    <h2>Resume</h2>
    <div class="card">Experience 1</div>
    <div class="card">Experience 2</div>
  </div>

  <div id="projects" class="section">
    <h2>Projects</h2>
    <div class="card">Project One</div>
    <div class="card">Project Two</div>
  </div>

  <div id="skills" class="section">
    <h2>Skills</h2>
    <div class="card">HTML • CSS • JS • GitHub</div>
  </div>

</div>

<script>
function show(id, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}
</script>

</body>
</html>
